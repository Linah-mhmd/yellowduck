{% extends 'base.html' %}

{% block title %}Login - Yellow Duck{% endblock %}

{% block content %}
<div class="login-container">
    <form method="POST">
        <h2>Login</h2>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn-primary">Login</button>
    </form>
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
    <p style="text-align:center; margin-top:18px; color: var(--text-muted);">Don't have an account? <a href="/signup" style="color: var(--accent);">Sign up</a></p>
</div>
{% endblock %}
